name: Public Release Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository for secrets and unsafe frontend auth storage
        run: python tools/security_check.py
      - name: Compile backend Python
        run: python -m compileall -q backend

  database-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: plataforma_agentes_test
          POSTGRES_USER: plataforma_agentes
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma_agentes -d plataforma_agentes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://plataforma_agentes@127.0.0.1:5432/plataforma_agentes_test
      PYTHONPATH: .
      BOOTSTRAP_PASSWORD: PublicValidationPassphrase123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install schema validation dependencies
        run: >-
          python -m pip install
          alembic==1.14.0
          SQLAlchemy==2.0.36
          psycopg2-binary==2.9.10
          python-dotenv==1.0.1
          pydantic==2.10.3
          email-validator==2.3.0
          fastapi==0.115.6
          python-jose==3.3.0
          passlib==1.7.4
          bcrypt==4.0.1
      - name: Apply the single clean database baseline
        run: |
          test "$(python -m alembic -c backend/alembic.ini heads | wc -l)" -eq 1
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
      - name: Bootstrap the first administrator
        run: >-
          python -m backend.scripts.bootstrap_admin
          --email admin@example.com
          --company-name "Empresa de Exemplo"
          --document 00000000000000
          --password-env BOOTSTRAP_PASSWORD
      - name: Validate the public repository contract
        run: bash tools/validate-public-release.sh

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: node ../tools/check-frontend-audit.mjs
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend for production
        run: npm run build

  frontend-build:
    # This diagnostic job runs even when the mandatory security audit blocks
    # frontend-checks, so type and production-build failures remain visible.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend for production
        run: npm run build

  frontend-offline-package:
    # The production host deliberately does not run npm ci: it has no swap and
    # insufficient available memory.  This job creates Linux x64 dependencies
    # from the exact lockfile after the security and build gates have passed.
    needs: [frontend-checks, frontend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify locked dependency security
        run: node ../tools/check-frontend-audit.mjs
      - name: Verify type-check and production build
        run: |
          npm run typecheck
          npm run build
      - name: Assemble offline Linux x64 package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --quiet "$SOURCE_COMMIT" -- frontend
          artifact="nextgenai-frontend-offline-${SOURCE_COMMIT}.tar.gz"
          lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          printf 'commit=%s\nlockfile_sha256=%s\nnode=%s\nplatform=%s\narchitecture=%s\n' \
            "$SOURCE_COMMIT" "$lock_sha" "$(node --version)" "$(node -p process.platform)" "$(node -p process.arch)" \
            > OFFLINE_PACKAGE_METADATA
          tar --owner=0 --group=0 --numeric-owner \
            --exclude='node_modules/.cache' \
          -czf "${artifact}" node_modules package.json package-lock.json OFFLINE_PACKAGE_METADATA
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Upload offline frontend package
        uses: actions/upload-artifact@v4
        with:
          name: nextgenai-frontend-offline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/nextgenai-frontend-offline-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
            frontend/nextgenai-frontend-offline-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  synthetic-integration:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres@127.0.0.1:5433/synthetic_nextgenai
      CODEX_INTEGRATION_CONTAINER: codex-integration-pg-20261020
      CODEX_EXPECT_WAHA_FIELDS: "1"
      CODEX_ISOLATED_PG_CONTAINER: codex-audit-pg-20261020
      WAHA_API_KEY: synthetic-waha-key
      WAHA_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated integration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start disposable PostgreSQL containers
        run: |
          docker run -d --name codex-integration-pg-20261020 -p 127.0.0.1:5433:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=synthetic_nextgenai postgres:15-alpine
          docker run -d --name codex-humanmode-pg-20261020 --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15-alpine
          docker run -d --name codex-audit-pg-20261020 --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15-alpine
          until docker exec codex-integration-pg-20261020 pg_isready -U postgres; do sleep 1; done
          until docker exec codex-humanmode-pg-20261020 pg_isready -U postgres; do sleep 1; done
          until docker exec codex-audit-pg-20261020 pg_isready -U postgres; do sleep 1; done
      - name: Create disposable integration schema
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Run isolated tenant and migration tests
        run: >-
          python -m pytest -q
          backend/tests/waha_isolated_integration_test.py
          backend/tests/crm_isolated_compatibility_test.py
          backend/tests/contact_human_mode_migration_test.py
          backend/tests/webhook_audit_migration_test.py
      - name: Remove disposable containers
        if: always()
        run: docker rm -f codex-integration-pg-20261020 codex-humanmode-pg-20261020 codex-audit-pg-20261020
